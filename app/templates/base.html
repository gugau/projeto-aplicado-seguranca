<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Protótipo seguro desenvolvido para a disciplina Projeto Aplicado.">
    <title>{% block title %}Projeto Aplicado{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('auth.index') }}" aria-label="Ir para o início">
        <span class="brand-mark" aria-hidden="true">PA</span>
        <span>Projeto Aplicado</span>
      </a>
    </header>
    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">Secure by Design · Secure by Default</footer>
  </body>
</html>
