{% extends "base.html" %}
{% block title %}Erro {{ code }} · Projeto Aplicado{% endblock %}
{% block content %}
  <section class="error-card card">
    <span class="error-code">{{ code }}</span>
    <h1>{{ message }}</h1>
    <p class="muted">Nenhum detalhe técnico foi exposto.</p>
    <a class="button-link" href="{{ url_for('auth.index') }}">Voltar ao início</a>
  </section>
{% endblock %}
