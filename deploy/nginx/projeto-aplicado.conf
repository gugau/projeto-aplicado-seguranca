server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __PUBLIC_ADDRESS__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name __PUBLIC_ADDRESS__;

    ssl_certificate /etc/letsencrypt/live/__PUBLIC_ADDRESS__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PUBLIC_ADDRESS__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers off;
    include /etc/nginx/snippets/projeto-pqc.conf;

    client_max_body_size 16k;

    location = /login {
        limit_req zone=login burst=4 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/projeto-proxy.conf;
    }

    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/projeto-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/projeto-proxy.conf;
    }
}
