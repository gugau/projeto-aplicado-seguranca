server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __PUBLIC_ADDRESS__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        default_type text/plain;
        return 200 "Servidor preparado para emissão do certificado.\n";
    }
}
