name: Implantação em produção

on:
  workflow_run:
    workflows: ["CI - Build e testes"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Baixar exatamente a versão aprovada
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Preparar conexão SSH com verificação do servidor
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          printf 'Host *\n  BatchMode yes\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 15\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Enviar artefato para uma nova versão
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SERVER_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$SERVER_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SERVER_PORT" =~ ^[0-9]{1,5}$ ]]
          git archive --format=tar.gz --output="$RUNNER_TEMP/$RELEASE_SHA.tar.gz" \
            "$RELEASE_SHA" app deploy tools wsgi.py requirements.txt
          scp -P "$SERVER_PORT" "$RUNNER_TEMP/$RELEASE_SHA.tar.gz" \
            "$SERVER_USER@$SERVER_HOST:/opt/projeto-aplicado/incoming/$RELEASE_SHA.tar.gz"

      - name: Ativar versão e reiniciar serviço
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            bash -s -- "$RELEASE_SHA" < deploy/release.sh
