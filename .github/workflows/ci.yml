name: CI - Build e testes

on:
  push:
    branches: [dev, hmg, main]
  pull_request:
    branches: [dev, hmg, main]

permissions:
  contents: read

jobs:
  build_test:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verificar consistência das dependências
        run: python -m pip check

      - name: Verificar padrões de credenciais no código e histórico
        run: python tools/check_secrets.py --history

      - name: Validar build da aplicação
        run: python -m compileall -q app tools wsgi.py

      - name: Validar sintaxe dos scripts de infraestrutura
        run: |
          for script in deploy/*.sh deploy/certbot/*.sh deploy/oci/*.sh; do
            bash -n "$script"
          done

      - name: Executar testes
        run: python -m pytest -q

      - name: Auditar dependências de aplicação e testes
        run: |
          python -m pip install 'pip-audit==2.10.1'
          python -m pip_audit --requirement requirements-dev.txt --progress-spinner off
