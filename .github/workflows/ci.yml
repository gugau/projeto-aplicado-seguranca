name: CI - Build e testes

on:
  push:
    branches: [dev, hmg, main]
  pull_request:
    branches: [dev, hmg, main]

permissions:
  contents: read

jobs:
  build_test:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verificar consistência das dependências
        run: python -m pip check

      - name: Validar build da aplicação
        run: python -m compileall -q app tools wsgi.py

      - name: Executar testes
        run: python -m pytest -q
