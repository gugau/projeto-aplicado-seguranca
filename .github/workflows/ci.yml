name: CI - Build e testes

on:
  push:
    branches: [dev, hmg, main]
  pull_request:
    branches: [dev, hmg, main]

permissions:
  contents: read

jobs:
  build_test:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verificar consistência das dependências
        run: python -m pip check

      - name: Validar build da aplicação
        run: python -m compileall -q app tools wsgi.py

      - name: Executar testes
        run: python -m pytest -q
